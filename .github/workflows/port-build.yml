name: ULTRACRAFT 1.21.1 Port Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare upstream source
        run: bash scripts/prepare-port.sh

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build port
        run: ./gradlew clean build --stacktrace --continue

      - name: Collect runnable JAR
        if: success()
        shell: bash
        run: |
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} artifact/ \;
          ls -lah artifact

      - name: Upload ULTRACRAFT 1.21.1 JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultracraft-1.21.1-port
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 30
