plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file('src/main/resources/ultracraft.accesswidener')
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://maven.ladysnake.org/releases' }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://libs.azuredoom.com:4443/mods' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Keep the 2.x API ULTRACRAFT was written against; 2.3.28 supports Fabric 1.21.1.
    modImplementation(include('maven.modrinth:7zlUOZvb:eXbDHtlS'))
    modImplementation(include('com.github.Chocohead:Fabric-ASM:v2.3'))

    // Core dependencies with 1.21.1 builds.
    modImplementation "maven.modrinth:K01OU20C:tVPYyTPV"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.playeranim_version}"
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"

    // ULTRACRAFT directly references GOOP effects; use its native 1.21.1 Fabric build.
    modImplementation "maven.modrinth:S8fWq3KT:CmNEu1jv"

    // Optional dynamic-light integration is compiled against the 1.21.1 API without forcing it at runtime.
    modCompileOnly "maven.modrinth:yBW8D80W:jMgX3AR4"

    // Config/UI dependencies used directly by source.
    modApi "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
    modApi "com.terraformersmc:modmenu:11.0.3"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
